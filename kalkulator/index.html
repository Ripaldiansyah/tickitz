<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
</head>
<body>
    
    <input type="number" name="args1" id="args1" placeholder="Masukan angka pertama">
    <input type="number" name="args2" id="args2" placeholder="Masukan angka kedua">
 <p id="hasil"></p>
    <button onclick="tambah()">+</button>
    <button onclick="kali()">*</button>
    <button onclick="kurang()">-</button>
    <button oncanplay="bagi()">/</button>

    <script>
        var args1 = document.getElementById("args1");
        var args2 = document.getElementById("args2");
        var hasil = document.getElementById("hasil")
       
        function tambah() {
            var hasilTambah = args1+args2;
            hasil.innerText(hasilTambah)
        }

        function kurang() {
          var hasilKurang = args1-args2;
          hasil.innerText(hasilKurang)  
        }

        function kali() {
           var hasilKali = args1*args2; 
           hasil.innerText(hasilKali)
        }
        function bagi(){
            var hasilBagi = args1/args2;
            hasil.innerText(hasilBagi)
        }
    </script>
</body>
</html>
